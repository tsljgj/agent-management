<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE//</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b; --fg:#d6eef2; --dim:#50646a; --faint:#182126; --line:#11181c;
  --acc:#00e5ff; --red:#ff2e63; --ok:#3dff9e; --warn:#ffb020;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--mono);display:flex;flex-direction:column;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:10;
  background:linear-gradient(90deg,transparent,var(--acc) 35%,var(--red) 65%,transparent);box-shadow:0 0 10px var(--acc)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[title]{cursor:default}
::selection{background:var(--acc);color:var(--bg)}

/* header */
header{display:flex;align-items:center;gap:20px;height:48px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex-shrink:0;min-width:0;overflow:hidden}
.logo{font-weight:800;letter-spacing:.2em;color:#fff;white-space:nowrap}
.logo i{font-style:normal}
.logo b{color:var(--red);text-shadow:0 0 8px var(--red)}
.tab{height:48px;position:relative;letter-spacing:.14em;color:var(--dim)}
.tab:hover{color:var(--fg)}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.tab sup{font-size:10px;margin-left:3px;color:var(--dim)}
.tab.hot sup{color:var(--red)}
.sp{flex:1}
.hb{height:30px;min-width:30px;padding:0 6px;color:var(--dim);font-size:13px}
.hb:hover{color:var(--acc)}
#age{font-size:11px}
#age.old{color:var(--warn)}
#wake{display:none;color:var(--warn)}
#wake.on{display:block}
#plus{font-size:20px;line-height:1;color:var(--acc)}
#ver{display:none;font-size:11px}
#ver.on{display:block}
#ver.new{color:var(--acc);font-weight:600}
#ver.busy{color:var(--warn)}
.win{display:none}.native .win{display:block}
.win.x:hover{color:var(--red)}
.noact .act{display:none!important}

/* account rows: name · 5h · 7d · actions */
main{flex:1;overflow-y:auto}
main::-webkit-scrollbar{width:4px}main::-webkit-scrollbar-thumb{background:var(--faint)}
.acct{display:grid;grid-template-columns:minmax(56px,1fr) minmax(88px,150px) minmax(88px,150px);align-items:center;gap:14px;
  position:relative;height:54px;padding:0 18px;border-bottom:1px solid var(--line);transition:opacity .2s,transform .2s}
.acct:hover{background:rgba(0,229,255,.03)}
.acct.gone{opacity:0;transform:translateX(20px)}
.nm{color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best .nm{color:var(--acc)}
.nm input{width:100%;background:none;border:0;border-bottom:1px solid var(--acc);outline:0;color:#fff;font:inherit;padding:0}
.stale .nm::after{content:" ·";color:var(--warn)}
.m{display:grid;grid-template-columns:18px 1fr 46px;align-items:center;gap:8px}
.m .k{font-size:10px;color:var(--dim)}
.bar{height:4px;background:var(--faint);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 6px var(--c)}
.m .v{text-align:right;font-weight:600;color:var(--c)}
.m.max .bar{background:var(--red)}
.m.max .bar i{display:none}
.m.max .v{color:var(--red);font-weight:400;font-size:12px}
.stale .m{opacity:.4}
.need{grid-column:2/4;display:flex;gap:12px;align-items:center;color:var(--dim);overflow:hidden;white-space:nowrap}
.need button{color:var(--acc);font-weight:600}
.need span{overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ra{position:absolute;right:6px;top:4px;display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .15s;
  background:linear-gradient(90deg,transparent,var(--bg) 18px);padding-left:20px}
.acct:hover .ra{pointer-events:auto}
.acct:hover .ra{opacity:1}
.ra button{width:24px;height:24px;color:var(--dim)}
.ra button:hover{color:var(--acc)}
.ra .del:hover,.ra .del.arm{color:var(--red)}
.ra .del.arm{width:auto;padding:0 4px}
#det{font-size:16px}
#det.on{color:var(--acc)}
.acct{cursor:pointer}
.acct.open{height:auto;padding-top:15px;padding-bottom:12px;align-items:start}
.acct.open .nm,.acct.open .m,.acct.open .need{min-height:22px;display:flex;align-items:center}
.acct.open .m{display:grid}
.det{display:none;grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 22px;margin-top:10px;
  padding:10px 0 2px;border-top:1px dashed var(--faint);font-size:12px;cursor:text;user-select:text}
.acct.open .det{display:grid}
.det div{display:grid;grid-template-columns:84px 1fr;gap:8px;min-width:0}
.det div.wide{grid-column:1/-1}
.det span{color:var(--dim)}
.det b{font-weight:400;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det b.red{color:var(--red)}.det b.warn{color:var(--warn)}
.empty{padding:48px 18px;color:var(--dim);text-align:center;line-height:2}
.empty button{color:var(--acc);font-size:15px}

/* add sheet */
#sheet{position:fixed;left:0;right:0;top:48px;bottom:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
#sheet.on{display:flex}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;color:var(--dim);letter-spacing:.14em;font-size:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line)}
.opt:hover{background:rgba(0,229,255,.05)}
.opt .i{width:16px;color:var(--acc);text-align:center}
.opt .t{color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .s{color:var(--dim);font-size:11px;white-space:nowrap}
.opt.restore .i{color:var(--warn)}
.opt input{flex:1;background:none;border:0;border-bottom:1px solid var(--faint);outline:0;color:#fff;font:inherit;padding:2px 0}
.opt input:focus{border-color:var(--acc)}

/* command line (log only shows while you use it) */
#log{max-height:0;overflow-y:auto;transition:max-height .2s;background:rgba(0,0,0,.4);user-select:text;font-size:12px}
.logopen #log{max-height:170px;padding:8px 18px;border-top:1px solid var(--line)}
#log div{white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.out{color:var(--acc)!important}.ok{color:var(--ok)!important}.warn{color:var(--warn)!important}
.crit,.error{color:var(--red)!important}.echo{color:var(--fg)!important}.sys{color:var(--fg)!important}
.prompt{display:flex;gap:10px;align-items:center;padding:10px 18px 12px;border-top:1px solid var(--line)}
.ps{color:var(--red)}
#cmd{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--acc)}
#cmd::placeholder{color:var(--faint)}
#toast{position:fixed;left:18px;right:18px;bottom:56px;padding:9px 12px;background:#0d1417;border-left:2px solid var(--acc);
  color:var(--fg);font-size:12px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:20;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:none}
#toast.bad{border-color:var(--red);color:var(--red)}
#toast.good{border-color:var(--ok)}
/* ---- adaptive layout: the window can be dragged to any size ---- */
@media (max-width:470px){
  header{gap:12px;padding-left:14px}.acct{gap:10px;padding:0 14px}.m{grid-template-columns:16px 1fr 38px;gap:6px}
  .det{grid-template-columns:1fr}.det div{grid-template-columns:70px 1fr}
}
@media (max-width:440px){ .logo{display:none} header{gap:14px} .hb{min-width:26px;padding:0 4px} }
@media (max-width:360px){ header{gap:10px;padding-left:12px} .tab{letter-spacing:.04em} #age,#ver{display:none!important} }
@media (max-width:380px){          /* two-line rows: name, then both meters */
  .acct{grid-template-columns:1fr 1fr;height:auto;padding:9px 14px 10px;gap:4px 12px}
  .acct .nm{grid-column:1/-1}.need{grid-column:1/-1}
}
@media (max-height:300px){ .prompt{display:none} .logopen #log{max-height:90px} }
@media (max-height:220px){ header{height:40px}.tab{height:40px} }
/* resize handles (frameless window has no OS border) */
.rz{position:fixed;z-index:30;display:none}
.native .rz{display:block}
.rz.n{top:0;left:10px;right:10px;height:4px;cursor:ns-resize}
.rz.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.nw{left:0;top:0;width:10px;height:10px;cursor:nwse-resize}
.rz.se{right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize}
.rz.ne{right:0;top:0;width:10px;height:10px;cursor:nesw-resize}
.rz.sw{left:0;bottom:0;width:12px;height:12px;cursor:nesw-resize}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="pywebview-drag-region">
  <div class="logo">R<i>EDLINE</i><b>//</b></div>
  <button class="tab" data-tab="claude">CLAUDE<sup id="nclaude"></sup></button>
  <button class="tab" data-tab="codex">CODEX<sup id="ncodex"></sup></button>
  <div class="sp"></div>
  <button class="hb act" id="wake" title="some accounts need a login — wake them">⚡</button>
  <button class="hb" id="age" title="sync now">⟳</button>
  <button class="hb" id="det" title="details (d)">⋯</button>
  <button class="hb" id="ver" title="check for updates"></button>
  <button class="hb act" id="plus" title="add account">+</button>
  <button class="hb win" id="bmin" title="minimize">_</button>
  <button class="hb win x" id="bhide" title="hide (Esc)">×</button>
</header>
<main id="list"></main>
<div id="sheet"></div>
<div id="log"></div>
<div class="prompt"><span class="ps">›</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder=""></div>
<div id="toast"></div>
<div class="rz n" data-e="n"></div><div class="rz s" data-e="s"></div><div class="rz w" data-e="w"></div><div class="rz e" data-e="e"></div>
<div class="rz nw" data-e="nw"></div><div class="rz ne" data-e="ne"></div><div class="rz sw" data-e="sw"></div><div class="rz se" data-e="se"></div>
<script>
const BOOT = /*__BOOT__*/{};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
let DATA = {usages: []}, lastEvent = 0, lastFetched = -1, linkOk = true;
let TAB = store.get("redline.tab", "claude");

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"X-Redline-Token": BOOT.token, "Content-Type": "application/json"}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function pull(force) {
  try {
    const d = await api(`api/usage?since=${lastEvent}${force ? "&force=1" : ""}`);
    linkOk = true;
    for (const e of d.events) {
      lastEvent = Math.max(lastEvent, e.id);
      log(e.text, e.level);
      if (e.alert || /^(wake done|updated|installing)/.test(e.text) || / logged in| login failed| no login /.test(e.text))
        toast(e.text, e.level === "crit" || e.level === "error" ? "bad" : e.level === "ok" ? "good" : "");
    }
    DATA = d;
    renderVersion();
    if (d.fetched_at !== lastFetched && !editing) { lastFetched = d.fetched_at; render(); }
  } catch (e) { linkOk = false; tick(); }
}
async function action(body, quiet) {
  if (!BOOT.actions) { toast("read-only console", "bad"); return false; }
  try {
    const r = await api("api/action", {method: "POST", body: JSON.stringify(body)});
    log(r.message, r.ok ? "out" : "error");
    if (!quiet || !r.ok) toast(r.message.split("\n").pop(), r.ok ? "" : "bad");
    if (["add", "add-profile", "remove", "restore", "scan", "bind"].includes(body.action)) setTimeout(() => pull(false), 1200);
    return r.ok;
  } catch (e) { log("failed: " + e.message, "error"); toast("failed: " + e.message, "bad"); return false; }
}

/* ---------- formatting ---------- */
const lvl = p => p == null ? "var(--dim)" : p >= 90 ? "var(--red)" : p >= 70 ? "var(--warn)" : "var(--ok)";
const spent = p => p != null && p >= 99.5;
function span(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d${h}h` : h ? `${h}:${pad(m)}` : `${m}m`;
}
const ago = s => (s = Math.max(0, Math.floor(s))) < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`;
const left = iso => iso ? (new Date(iso) - Date.now()) / 1000 : null;
const short = u => u.windows.find(w => w.name === "5h") || u.windows[0];
function best(provider) {
  const c = DATA.usages.filter(u => u.ok && u.provider === provider && u.windows.length && !u.windows.some(w => spent(w.used_percent)));
  c.sort((a, b) => (short(a)?.used_percent ?? 999) - (short(b)?.used_percent ?? 999));
  return c[0];
}
const needsLogin = u => !u.ok && !u.stale;

/* ---------- render ---------- */
function meter(w, label) {
  if (!w) return `<div class="m"><span class="k">${label}</span><div class="bar"></div><span class="v" style="--c:var(--dim)">–</span></div>`;
  const p = w.used_percent, when = left(w.resets_at);
  const tip = `${w.name} ${p == null ? "?" : Math.round(p) + "%"}${w.resets_at ? " · resets " + new Date(w.resets_at).toLocaleString() : ""}`;
  if (spent(p)) return `<div class="m max" title="${esc(tip)}"><span class="k">${label}</span><div class="bar"></div>
    <span class="v" data-reset="${esc(w.resets_at || "")}">${when != null ? "↻" + span(when) : "MAX"}</span></div>`;
  const width = p == null ? 0 : Math.min(100, Math.max(0, p));
  return `<div class="m" style="--c:${lvl(p)}" title="${esc(tip)}"><span class="k">${label}</span>
    <div class="bar"><i style="width:${width}%"></i></div><span class="v">${p == null ? "?" : Math.floor(p) + "%"}</span></div>`;
}
function row(u, bestName) {
  const n = esc(u.account);
  const extra = u.windows.filter(w => w.name !== "5h" && w.name !== "7d").map(w => `${w.name} ${Math.round(w.used_percent)}%`)
    .concat(Object.entries(u.extra || {}).map(([k, v]) => `${k} ${v}`));
  const tip = [u.email, u.plan, ...extra, u.stale ? "stale: " + u.error : ""].filter(Boolean).join(" · ");
  const body = needsLogin(u)
    ? `<div class="need"><button class="act" data-act="login">login ›</button><span title="${esc(u.error)}">${esc(shortErr(u.error))}</span></div>`
    : meter(u.windows.find(w => w.name === "5h"), "5h") + meter(u.windows.find(w => w.name === "7d"), "7d");
  return `<div class="acct${u.account === bestName ? " best" : ""}${u.stale ? " stale" : ""}${isOpen(u.account) ? " open" : ""}" data-name="${n}">
    <div class="nm" title="${esc(tip)}${tip ? " · " : ""}double-click to rename">${n}</div>${body}
    <div class="ra act"><button data-act="web" title="open ${u.provider === "codex" ? "chatgpt.com" : "claude.ai"} in its Chrome profile">↗</button><button data-act="jack" title="terminal as ${n}">›_</button><button data-act="rename" title="rename">✎</button><button class="del" data-act="del" title="remove">✕</button></div>${details(u)}</div>`;
}
/* ---------- details (⋯ for all rows, or click a row) ---------- */
let DETAILS = store.get("redline.details", "0") === "1";
const opened = new Set();
const isOpen = name => DETAILS || opened.has(name);
function when(iso) {
  if (!iso) return "–";
  const d = new Date(iso), l = left(iso), today = d.toDateString() === new Date().toDateString();
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return (today ? t : d.toLocaleDateString(undefined, {weekday: "short"}) + " " + t) + (l > 0 ? `  (in ${span(l)})` : "");
}
function details(u) {
  const info = ((DATA.meta || {}).accounts || {})[u.account] || {};
  const kv = (k, v, cls = "", wide = false) => `<div${wide ? ' class="wide"' : ""}><span>${esc(k)}</span><b class="${cls}" title="${esc(v)}">${esc(v)}</b></div>`;
  const rows = [kv("email", u.email || info.email || "–", "", true), kv("plan", u.plan || "–"),
    kv("synced", u.fetched_at ? ago((Date.now() - new Date(u.fetched_at)) / 1000) + " ago" + (u.stale ? " (stale)" : "") : "–", u.stale ? "warn" : "")];
  for (const w of u.windows) {
    const p = w.used_percent;
    rows.push(kv(w.name, `${p == null ? "?" : Math.round(p) + "%"} · resets ${when(w.resets_at)}`, spent(p) ? "red" : p >= 70 ? "warn" : "", true));
  }
  for (const [k, v] of Object.entries(u.extra || {})) rows.push(kv(k, v, "", true));
  const pr = info.profile;
  rows.push(kv("chrome", pr ? `${pr.name} · ${pr.email || pr.spec}${pr.bound ? "" : " (auto)"}` : "not linked · bind <name> <email>", "", true));
  if (!u.ok) rows.push(kv("error", u.error || "", "red", true));
  if (info.home) rows.push(kv("dir", info.home, "", true));
  return `<div class="det">${rows.join("")}</div>`;
}
function setDetails(on) {
  DETAILS = on; store.set("redline.details", on ? "1" : "0");
  if (!on) opened.clear();
  $("#det").classList.toggle("on", on); render();
}
function shortErr(e) {
  e = String(e || "");
  if (/not logged in/.test(e)) return "not logged in";
  if (/expired/.test(e)) return "token expired";
  if (/unauthorized/.test(e)) return "signed out";
  if (/rate limited/.test(e)) return "rate limited";
  if (/network/.test(e)) return "offline";
  return e.split(/[;:(]/)[0];
}
function render() {
  const us = DATA.usages || [];
  for (const p of ["claude", "codex"]) {
    const mine = us.filter(u => u.provider === p);
    $("#n" + p).textContent = mine.length || "";
    const hot = mine.some(u => needsLogin(u) || u.windows.some(w => w.name === "5h" && w.used_percent >= 90));
    document.querySelector(`.tab[data-tab="${p}"]`).classList.toggle("hot", hot);
  }
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === TAB));
  const mine = us.filter(u => u.provider === TAB);
  const waiting = mine.filter(needsLogin).length;
  $("#wake").classList.toggle("on", waiting > 0);
  $("#wake").textContent = waiting ? `⚡${waiting}` : "⚡";
  if (!mine.length) {
    $("#list").innerHTML = DATA.fetched_at || us.length
      ? `<div class="empty">no ${TAB} accounts<br><button class="act" id="emptyAdd">+ add one</button></div>`
      : `<div class="empty">…</div>`;
    const b = $("#emptyAdd"); if (b) b.onclick = openSheet;
    return;
  }
  const b = best(TAB);
  $("#list").innerHTML = mine.map(u => row(u, mine.length > 1 ? b?.account : null)).join("");
  tick();
  if (typeof fitHeight === "function") requestAnimationFrame(fitHeight);
}
function renderVersion() {
  const u = (DATA.meta || {}).update, v = $("#ver");
  if (!u || !u.build) { v.classList.remove("on"); return; }
  v.classList.add("on");
  const newer = u.latest && u.latest > u.build;
  v.classList.toggle("new", newer && u.state !== "installing");
  v.classList.toggle("busy", u.state === "installing");
  v.textContent = u.state === "installing" ? `↻b${u.latest}` : newer ? `↑b${u.latest}` : `b${u.build}`;
  v.title = newer ? `build ${u.latest} is available (you have ${u.build}) · click to install`
                  : `build ${u.build}` + (u.checked ? ` · checked ${new Date(u.checked * 1000).toLocaleTimeString()}` : "") + " · click to check for updates";
}
async function checkUpdate() {
  const v = $("#ver");
  v.textContent = "…"; v.classList.add("busy");
  toast("checking for updates…");
  await action({action: "update"});
  setTimeout(() => pull(false), 800);
}
function setTab(t) { TAB = t === "codex" ? "codex" : "claude"; store.set("redline.tab", TAB); closeSheet(); render(); }
function tick() {
  document.querySelectorAll("[data-reset]").forEach(el => { const l = left(el.dataset.reset); if (l != null) el.textContent = "↻" + span(l); });
  const a = $("#age");
  if (!DATA.fetched_at) return;
  const s = Date.now() / 1000 - DATA.fetched_at, at = new Date(DATA.fetched_at * 1000);
  a.textContent = linkOk ? ago(s) : "offline";
  a.classList.toggle("old", !linkOk || s > 600);
  const nx = (DATA.next_at || 0) - Date.now() / 1000;
  a.title = `synced ${pad(at.getHours())}:${pad(at.getMinutes())}:${pad(at.getSeconds())}` + (DATA.next_at ? ` · next in ${span(nx)}` : "") + " · click to sync now";
}

/* ---------- rename in place ---------- */
let editing = false;
function startRename(card) {
  const nm = card.querySelector(".nm"), old = card.dataset.name;
  if (!nm || nm.querySelector("input")) return;
  editing = true;
  nm.innerHTML = `<input value="${esc(old)}" spellcheck="false" maxlength="40">`;
  const inp = nm.querySelector("input"); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true; editing = false;
    const neu = inp.value.trim();
    if (save && neu && neu !== old) {
      nm.textContent = neu; card.dataset.name = neu;
      if (!(await action({action: "rename", name: old, new: neu}))) { nm.textContent = old; card.dataset.name = old; }
      pull(false);
    } else { nm.textContent = old; }
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
}
$("#list").addEventListener("dblclick", e => { const c = e.target.closest(".acct"); if (c && BOOT.actions && e.target.closest(".nm")) startRename(c); });

/* ---------- add sheet ---------- */
async function openSheet() {
  const sh = $("#sheet");
  sh.innerHTML = `<div class="sh"><span>ADD ${TAB.toUpperCase()} ACCOUNT</span><button class="hb" data-x="close">esc</button></div><div class="opt"><span class="s">loading…</span></div>`;
  sh.classList.add("on");
  let c = {removed: [], profiles: []};
  try { c = await api(`api/candidates?provider=${TAB}`); } catch (e) {}
  const opts = [];
  for (const r of c.removed) opts.push(`<button class="opt restore" data-x="restore" data-v="${esc(r.name)}"><span class="i">↺</span><span class="t">${esc(r.name)}</span><span class="s">${esc(r.email || "")} · removed</span></button>`);
  for (const p of c.profiles) opts.push(`<button class="opt" data-x="profile" data-v="${esc(p.spec)}"><span class="i">◉</span><span class="t">${esc(p.email)}</span><span class="s">${esc(p.browser)} · ${esc(p.name)}</span></button>`);
  opts.push(`<button class="opt" data-x="scan"><span class="i">⌕</span><span class="t">scan this computer</span><span class="s">existing logins</span></button>`);
  opts.push(`<div class="opt"><span class="i">+</span><input id="newName" placeholder="other: type a name, Enter" spellcheck="false"></div>`);
  sh.innerHTML = `<div class="sh"><span>ADD ${TAB.toUpperCase()} ACCOUNT</span><button class="hb" data-x="close">esc</button></div>` + opts.join("");
  $("#newName").addEventListener("keydown", async e => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    const name = e.target.value.trim(); closeSheet();
    if (await action({action: "add", provider: TAB, name}, true)) action({action: "login", name});
  });
}
function closeSheet() { $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", async e => {
  const b = e.target.closest("[data-x]"); if (!b) return;
  const x = b.dataset.x, v = b.dataset.v;
  if (x === "close") return closeSheet();
  closeSheet();
  if (x === "restore") action({action: "restore", name: v});
  if (x === "profile") action({action: "add-profile", provider: TAB, profile: v});
  if (x === "scan") action({action: "scan"});
});

/* ---------- log / toast ---------- */
function log(text, level = "info") {
  const el = $("#log");
  for (const line of String(text).split("\n")) {
    const d = document.createElement("div"); d.className = level; d.textContent = line; el.appendChild(d);
  }
  while (el.children.length > 300) el.firstChild.remove();
  el.scrollTop = el.scrollHeight;
}
const openLog = on => document.body.classList.toggle("logopen", on);
let toastT;
function toast(text, kind = "") {
  const t = $("#toast"); t.textContent = text; t.className = "show " + kind;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = kind, 3500);
}

/* ---------- commands (for keyboard people; everything is also a button) ---------- */
const HELP = [
  ["claude | codex", "switch tab (Alt+1/2)"], ["add", "open the + panel"], ["add <name>", "new account, then log in"],
  ["login <name>", "log in via its Chrome"], ["wake", "log in / refresh this tab"], ["web <name>", "open its web page"],
  ["jack <name>", "terminal as <name>"], ["d | details", "expand all rows (or click one)"], ["fit", "auto-size the window again"], ["rename <old> <new>", "rename (or double-click)"], ["rm <name..> -y", "remove (files kept)"], ["restore <name>", "undo a removal"],
  ["scan [all]", "find logins on this PC"], ["bind <name> <email>", "pin a Chrome profile"], ["ls | r | update | clear", ""],
];
const COMMANDS = ["help","claude","codex","details","add","login","wake","web","jack","rename","rm","restore","removed","scan","bind","profiles","ls","sync","update","clear","hide"];
const tabNames = () => DATA.usages.filter(u => u.provider === TAB).map(u => u.account);
const hist = []; let hi = 0;
async function run(line) {
  const [c, ...a] = line.trim().split(/\s+/);
  if (!c) return;
  openLog(true); log("› " + line.trim(), "echo");
  const need = u => { if (!a[0]) { log("usage: " + u, "error"); return false; } return true; };
  switch (c.toLowerCase()) {
    case "help": case "?": HELP.forEach(([k, v]) => log(k.padEnd(22) + v, "out")); break;
    case "claude": case "codex": setTab(c.toLowerCase()); openLog(false); break;
    case "add":
      if (!a[0]) { openLog(false); openSheet(); break; }
      { const [prov, name] = a.length > 1 ? [a[0], a[1]] : [TAB, a[0]];
        if (await action({action: "add", provider: prov, name}, true)) { setTab(prov); action({action: "login", name}); } }
      break;
    case "login": if (need("login <name>")) await action({action: "login", name: a[0]}); break;
    case "wake": if (a[0] === "cancel") await action({action: "wake-cancel"});
      else await action({action: "wake", names: a.length ? a : tabNames()}); break;
    case "web": if (need("web <name>")) await action({action: "web", name: a[0]}, true); break;
    case "jack": case "run": if (need("jack <name>")) await action({action: "launch", name: a[0]}, true); break;
    case "rm": case "remove": {
      const names = a.filter(x => x !== "-y");
      if (!names.length) { log("usage: rm <name..> -y", "error"); break; }
      if (!a.includes("-y")) { log(`confirm: rm ${names.join(" ")} -y`, "warn"); break; }
      for (const n of names) await action({action: "remove", name: n}); break;
    }
    case "fit":
      manualSize = false; if (native()) { await window.pywebview.api.reset_size(); fitHeight(); }
      log("window height follows the content again", "ok"); break;
    case "d": case "details": setDetails(!DETAILS); openLog(false); break;
    case "rename": case "mv": if (a.length < 2) { log("usage: rename <old> <new>", "error"); break; }
      await action({action: "rename", name: a[0], new: a[1]}); break;
    case "restore": case "undo": if (need("restore <name>")) await action({action: "restore", name: a[0]}); break;
    case "removed": await action({action: "removed"}, true); break;
    case "scan": await action({action: "scan", all: a[0] === "all"}); break;
    case "bind": if (a.length < 2) { log("usage: bind <name> <google email | Profile 2 | none>", "error"); break; }
      await action({action: "bind", name: a[0], profile: a.slice(1).join(" ")}); break;
    case "profiles": await action({action: "profiles"}, true); break;
    case "ls": DATA.usages.filter(u => u.provider === TAB).forEach(u => log(`${u.account.padEnd(18)} ${u.email || ""}  ${
      u.windows.map(w => `${w.name} ${Math.round(w.used_percent)}%`).join(" ") || u.error}`, "out")); break;
    case "r": case "sync": await pull(true); log("synced", "ok"); break;
    case "update": await action({action: "update"}); break;
    case "clear": case "cls": $("#log").innerHTML = ""; openLog(false); break;
    case "hide": case "exit": hideWindow(); break;
    default: log(`unknown: ${c} (help)`, "error");
  }
}
function complete(input) {
  const parts = input.value.split(/\s+/), cur = parts[parts.length - 1].toLowerCase();
  const pool = parts.length === 1 ? COMMANDS : parts[0] === "scan" ? ["all"] : DATA.usages.map(u => u.account);
  const hits = pool.filter(x => x.toLowerCase().startsWith(cur));
  if (hits.length === 1) { parts[parts.length - 1] = hits[0]; input.value = parts.join(" ") + " "; }
  else if (hits.length > 1) { openLog(true); log(hits.join("  "), "out"); }
}

/* ---------- events ---------- */
$("#cmd").addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter") { const v = el.value; if (v.trim()) { hist.push(v); hi = hist.length; } el.value = ""; run(v); }
  else if (e.key === "ArrowUp") { if (hi > 0) el.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); el.value = hist[hi] || ""; e.preventDefault(); }
  else if (e.key === "Tab") { e.preventDefault(); complete(el); }
});
document.addEventListener("keydown", e => {
  if (editing) return;
  if (e.key === "Escape") {
    if ($("#sheet").classList.contains("on")) closeSheet();
    else if (document.body.classList.contains("logopen")) openLog(false);
    else hideWindow();
    return;
  }
  if (e.altKey && (e.key === "1" || e.key === "2")) { setTab(e.key === "1" ? "claude" : "codex"); return; }
  if (document.activeElement.tagName !== "INPUT" && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) $("#cmd").focus();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));
$("#age").onclick = async () => { $("#age").textContent = "…"; await pull(true); };
$("#ver").onclick = checkUpdate;
$("#det").onclick = () => setDetails(!DETAILS);
$("#det").classList.toggle("on", DETAILS);
$("#plus").onclick = () => $("#sheet").classList.contains("on") ? closeSheet() : openSheet();
$("#wake").onclick = () => action({action: "wake", names: DATA.usages.filter(u => u.provider === TAB && needsLogin(u)).map(u => u.account)});
$("#list").addEventListener("click", e => {
  if (!e.target.closest("[data-act]")) {
    openLog(false);
    const c = e.target.closest(".acct");
    if (c && !editing && !e.target.closest(".det") && !getSelection().toString()) {
      const n = c.dataset.name;
      if (DETAILS) { setDetails(false); opened.clear(); }
      else if (opened.has(n)) opened.delete(n); else opened.add(n);
      render();
    }
    return;
  }
  const b = e.target.closest("[data-act]"), card = b.closest(".acct"), name = card.dataset.name;
  if (b.dataset.act === "del") {
    if (!b.classList.contains("arm")) {   // first click arms, second removes
      b.classList.add("arm"); b.textContent = "sure?";
      setTimeout(() => { b.classList.remove("arm"); b.textContent = "✕"; }, 3000);
      return;
    }
    card.classList.add("gone");
    action({action: "remove", name}, true).then(ok => {
      if (ok) toast(`removed ${name} · type "restore ${name}" or use + to undo`);
      else card.classList.remove("gone");
    });
    return;
  }
  if (b.dataset.act === "rename") return startRename(card);
  const map = {web: "web", jack: "launch", login: "login"};
  action({action: map[b.dataset.act], name}, b.dataset.act !== "login");
});

/* ---------- native window (pywebview) ---------- */
const native = () => window.pywebview && window.pywebview.api;
function hideWindow() { if (native()) window.pywebview.api.hide(); }
window.addEventListener("pywebviewready", () => { document.body.classList.add("native"); setTimeout(fitHeight, 300); });

/* ---------- window size: drag any edge; auto-fit height until resized by hand ---------- */
let manualSize = !!BOOT.manual_size;
document.querySelectorAll(".rz").forEach(h => h.addEventListener("pointerdown", e => {
  if (!native()) return;
  e.preventDefault(); h.setPointerCapture(e.pointerId);
  const edge = h.dataset.e, x0 = e.screenX, y0 = e.screenY, w0 = innerWidth, h0 = innerHeight;
  let pending = null, busy = false, last = [w0, h0];
  const push = async () => {
    if (busy || !pending) return; busy = true;
    const [w, hh] = pending; pending = null; last = [w, hh];
    try { await window.pywebview.api.resize(w, hh, edge); } catch (err) {}
    busy = false; if (pending) push();
  };
  const move = ev => {
    const dx = ev.screenX - x0, dy = ev.screenY - y0;
    let w = w0, hh = h0;
    if (edge.includes("e")) w = w0 + dx;
    if (edge.includes("w")) w = w0 - dx;
    if (edge.includes("s")) hh = h0 + dy;
    if (edge.includes("n")) hh = h0 - dy;
    pending = [Math.max(300, Math.round(w)), Math.max(160, Math.round(hh))]; push();
  };
  const up = () => {
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up);
    manualSize = true;
    window.pywebview.api.save_size(...(pending || last));
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
}));
function fitHeight() {
  if (manualSize || !native()) return;
  const header = $("header").offsetHeight, prompt = $(".prompt").offsetHeight || 0;
  const rows = [...$("#list").children].reduce((a, el) => a + el.offsetHeight, 0);
  const logH = document.body.classList.contains("logopen") ? $("#log").offsetHeight : 0;
  window.pywebview.api.fit(innerWidth, header + Math.max(rows, 120) + prompt + logH + 2);
}
$("#bhide").onclick = hideWindow;
$("#bmin").onclick = () => native() && window.pywebview.api.minimize();

/* ---------- boot ---------- */
if (!BOOT.actions) document.body.classList.add("noact");
log(`redline ${BOOT.version || ""}${BOOT.build ? " · build " + BOOT.build : ""} · help`, "sys");
render(); pull(false); setInterval(() => pull(false), 5000); setInterval(tick, 1000);
setTimeout(() => $("#cmd").focus(), 200);
</script>
</body></html>
