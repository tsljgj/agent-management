<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE//</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b; --fg:#d6eef2; --dim:#50646a; --faint:#182126; --line:#11181c;
  --acc:#00e5ff; --red:#ff2e63; --ok:#3dff9e; --warn:#ffb020;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--mono);display:flex;flex-direction:column;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:10;
  background:linear-gradient(90deg,transparent,var(--acc) 35%,var(--red) 65%,transparent);box-shadow:0 0 10px var(--acc)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[title]{cursor:default}
button,button[title],[data-act]{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:1px solid var(--acc);outline-offset:2px;border-radius:3px}
::selection{background:var(--acc);color:var(--bg)}

/* header */
header{display:flex;align-items:center;gap:20px;height:48px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex-shrink:0;min-width:0;overflow:hidden}
.logo{font-weight:800;letter-spacing:.2em;color:#fff;white-space:nowrap}
.logo i{font-style:normal}
.logo b{color:var(--red);text-shadow:0 0 8px var(--red)}
.tab{height:48px;position:relative;letter-spacing:.14em;color:var(--dim)}
.tab{padding:0 4px;transition:color .12s,background .12s,transform .08s}
.tab:hover{color:var(--fg);background:linear-gradient(transparent 20%,rgba(0,229,255,.06))}
.tab:active{transform:translateY(1px)}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.tab sup{font-size:10px;margin-left:3px;color:var(--dim)}
.tab.hot sup{color:var(--red)}
.tab.waiting sup{color:var(--warn)}
#weeklyNotice,#wsNotice{display:none;padding:7px 18px;border-bottom:1px solid var(--line);color:var(--warn);font-size:11px;line-height:1.6;flex-shrink:0}
#weeklyNotice.on,#wsNotice.on{display:block}
/* workspace notices: the first one on a line, the rest behind +N (click to list them all) */
#wsNotice{color:var(--dim);cursor:pointer;user-select:none;transition:background .15s}
#wsNotice:hover{background:rgba(255,176,32,.04)}
#wsNotice.on{display:flex;gap:8px;align-items:flex-start}
#wsNotice .ni{color:var(--warn);flex:none}
#wsNotice .nl{flex:1;min-width:0;display:flex;flex-direction:column}
#wsNotice .nl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wsNotice .nl span+span{display:none}
#wsNotice.open .nl span+span{display:block}
#wsNotice .nmore{flex:none;color:var(--warn);font-size:10px;letter-spacing:.04em}
.sp{flex:1}
.tools{display:flex;align-items:center;gap:2px;flex-shrink:0}
/* header tools: a framed hover, a press, a hit area of 32px */
.hb{height:32px;min-width:32px;padding:0 7px;color:var(--dim);font-size:13px;border:1px solid transparent;border-radius:4px;
  transition:color .12s,background .12s,border-color .12s,transform .08s}
.hb:hover{color:var(--acc);background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.3)}
.hb:active{transform:scale(.92);background:rgba(0,229,255,.14)}
/* the window moves only from the header's empty space (the logo and the gap), never from a button */
.native header .pywebview-drag-region{cursor:grab}
.native header .pywebview-drag-region:active{cursor:grabbing}
header button{cursor:pointer}
#age{font-size:11px}
#age.old{color:var(--warn)}
#wake{display:none;color:var(--warn)}
#wake.on{display:block}
#wake.hide,.tab.hide,#plus.hide{display:none!important}
#plus{font-size:20px;line-height:1;color:var(--acc)}
#ver{display:none;font-size:11px}
#ver.on{display:block}
#ver.new{color:var(--acc);font-weight:600}
#ver.busy{color:var(--warn)}
.win{display:none}.native .win{display:block}
.win.x:hover{color:var(--red)}
.noact .act{display:none!important}

/* account rows: name · 5h · 7d · actions */
main{flex:1;overflow-y:auto;scrollbar-gutter:stable}  /* the scrollbar appearing must not shift the rows */
main::-webkit-scrollbar{width:4px}main::-webkit-scrollbar-thumb{background:var(--faint)}
.acct{display:grid;grid-template-columns:minmax(84px,1fr) minmax(120px,180px) minmax(120px,180px);grid-template-rows:minmax(40px,auto);align-items:center;gap:14px 24px;
  position:relative;min-height:60px;padding:10px 18px;border-bottom:1px solid var(--line);transition:opacity .2s,transform .2s,background .15s}
.acct:hover{background:rgba(0,229,255,.035)}
.acct.open{background:rgba(255,255,255,.018)}
.acct:active:not(:has(button:active)){background:rgba(0,229,255,.06)}
/* which accounts can be used right now: a green edge (cyan on the one with the most 5h left);
   an account that is used up has no edge, a dimmed name, and says when it is back */
.acct.ready{box-shadow:inset 2px 0 var(--ok)}
.acct.ready.best{box-shadow:inset 3px 0 var(--acc)}
.acct.blocked .nm{color:#9fb3b8}
.acct.blocked .dial{opacity:.55}
.acct.codex{grid-template-columns:minmax(170px,1fr) minmax(105px,180px) minmax(105px,180px);column-gap:16px}
.acct.weekly-attention{box-shadow:inset 2px 0 var(--warn)}
.acct.gone{opacity:0;transform:translateX(20px)}
.nm{color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best .nm{color:var(--acc)}
.nm input{width:100%;background:none;border:0;border-bottom:1px solid var(--acc);outline:0;color:#fff;font:inherit;padding:0}
.stale .nm::after{content:" ·";color:var(--warn)}
/* green dot = a chat is running now */
.live .nm::before{content:"● ";color:var(--ok);font-size:11px}
/* name, and under it how fast the account is being used right now */
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
/* extra credits on top of the plan (Codex): usable once the windows run out */
.cred{font-size:10px;letter-spacing:.06em;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banked{font-size:10px;color:var(--acc);white-space:nowrap}
/* the plan's monthly API credit (Claude Max / Team): whole dollars left, coloured like the meters as it
   runs low (amber at 30% left, red at 10%); cyan = most of it left and it lapses within 3 days */
.usd{--c:var(--ok);color:var(--c);letter-spacing:.06em}
.usd.mid{--c:var(--warn)}.usd.high{--c:var(--red)}.usd.urgent{--c:var(--acc)}.usd.old{opacity:.45}
.codex .rate b,.codex .rate span{display:none}
.plan{font-size:10px;letter-spacing:.08em;color:var(--dim)}
/* under the name, in fixed slots so every row lines up whatever its state: the gauge (and level),
   [Codex: banked resets], the subscription's last days or FREE, [Codex: credits, the only free width] */
.dial{display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px 10px;min-width:0;min-height:21px}
.dial>*{flex:none}
.dial .rate{width:86px}.codex .dial .rate{width:38px}
.dial .slot{width:60px;overflow:hidden}   /* fits SUB ~28d */
.dial .slot.cr{width:34px}                /* fits $200 */
.dial .cred{flex:0 1 auto;min-width:0;letter-spacing:0}
/* days left: grey beyond a week, then coloured like the gauge: green, amber from 3 days, red from 1 */
.sub{--c:var(--ok);font-size:10px;letter-spacing:.08em;font-weight:600;color:var(--c);text-shadow:0 0 6px var(--c);white-space:nowrap}
.sub.mid{--c:var(--warn)}.sub.high{--c:var(--red)}.sub.far{--c:var(--dim);font-weight:400;text-shadow:none}
/* token expired but the old numbers are still shown: one click renews it (or logs in) */
.reauth{align-self:flex-start;font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--warn);white-space:nowrap}
.reauth:hover{color:var(--acc)}
.weekly{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10px;color:var(--dim)}
.weekly.unstarted,.weekly.unknown{color:var(--warn);font-weight:600}
.weekly.busy{color:var(--acc)}
.weekly.error{color:var(--red)}
.rate{display:flex;align-items:flex-end;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden}
/* LED gauge, lit like the meters: dark segments = the track, lit ones glow in the level's colour */
.rate{--c:var(--dim)}.rate.low{--c:var(--ok)}.rate.mid{--c:var(--warn)}.rate.high{--c:#ff7a2e}.rate.hot{--c:var(--red)}
.rate.burn{--c:#ff3df0}.rate.burn b{animation:burn 1.2s ease-in-out infinite}
@keyframes burn{50%{opacity:.45}}
.rate svg{flex:none;width:38px;height:21px;overflow:visible}
.rate svg .sg{fill:none;stroke:var(--faint);stroke-width:3.4}
.rate svg .sg.on{stroke:var(--c);filter:drop-shadow(0 0 2px var(--c))}
.rate svg .tk{stroke:var(--dim);stroke-width:.8}
.rate svg .nd{stroke:var(--c);stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--c))}
.rate svg .hub{fill:var(--bg);stroke:var(--c);stroke-width:1.2}
/* BOOM: the week's quota is going 1.5x faster than "this account should last N days" (`expect`).
   The dial is pinned past its end and throws sparks, and the time until the nearest limit runs out
   replaces the level. The sooner, the harder it goes: l1 > 12h, l2 > 2h, l3 within 2h. */
.rate.boom{--c:#ff2d55;overflow:visible}
.rate.boom svg{animation:rl-shake 1s linear infinite}
.rate.boom.l2 svg{animation-duration:.42s}
.rate.boom.l3 svg{animation-duration:.16s;filter:drop-shadow(0 0 4px var(--c))}
.rate.boom svg .sg.on{stroke:var(--c);animation:rl-flick 1.4s steps(2) infinite}
.rate.boom.l2 svg .sg.on{animation-duration:.6s}.rate.boom.l3 svg .sg.on{animation-duration:.22s}
.rate.boom svg .spk{stroke:#ffd23d;stroke-width:1.1;stroke-linecap:round;opacity:0;animation:rl-spark 1s ease-out infinite}
.rate.boom svg .spk:nth-of-type(2n){animation-delay:.33s}.rate.boom svg .spk:nth-of-type(3n){animation-delay:.66s}
.rate.boom.l2 svg .spk{animation-duration:.55s}.rate.boom.l3 svg .spk{animation-duration:.3s}
.rate.boom b{color:#fff;background:var(--c);padding:1px 4px;border-radius:2px;text-shadow:0 0 8px var(--c);letter-spacing:.02em;text-transform:none}
.rate.boom.l2 b{animation:rl-strobe .7s steps(2) infinite}
.rate.boom.l3 b{animation:rl-strobe .26s steps(2) infinite}
.codex .dial .rate.boom{width:auto}.codex .rate.boom b{display:inline}
/* already blown: a limit is used up. A cracked, dark dial with a wisp of smoke */
.rate.dead{--c:var(--red)}
.rate.dead svg .sg{stroke:#3a1418}.rate.dead svg .sg.cr{stroke:var(--red);opacity:.55}
.rate.dead svg .nd{stroke:var(--dim);filter:none}.rate.dead svg .hub{stroke:var(--dim)}
.rate.dead svg .smk{fill:#9aa3ad;opacity:0;transform-box:fill-box;transform-origin:center;animation:rl-smoke 2.6s ease-out infinite}
.rate.dead svg .smk:nth-of-type(2){animation-delay:1.3s}
.rate.dead b{color:var(--red);text-shadow:0 0 6px var(--red)}
.codex .dial .rate.dead{width:auto}.codex .rate.dead b{display:inline}
@keyframes rl-shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-.9px,.4px) rotate(-4deg)}
  40%{transform:translate(.8px,-.5px) rotate(3deg)}60%{transform:translate(-.5px,-.4px) rotate(-2deg)}80%{transform:translate(.6px,.5px) rotate(2deg)}}
@keyframes rl-flick{50%{stroke:#ffd23d}}
@keyframes rl-spark{0%{opacity:1}100%{opacity:0}}
@keyframes rl-strobe{50%{background:#ffd23d;color:#000}}
@keyframes rl-smoke{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(4px,-10px) scale(1.8)}}
.rate b{font-weight:600;color:var(--c);text-shadow:0 0 6px var(--c)}
.rate.idle b{text-shadow:none}
.rate span{display:none;text-transform:none;letter-spacing:0}   /* the %/h only where there is room (two-line rows) */
.det .prj{display:flex;gap:10px;align-items:baseline;min-width:0}
.det .prj b{flex:1}
.det .prj em{font-style:normal;color:var(--dim);font-size:11px;white-space:nowrap}
.det .prj em.on{color:var(--ok)}
/* small inline controls (✎ renew, reconnect, projects): framed, at least 24px tall, easy to hit */
.det .prj button{color:var(--dim);font-size:11px;white-space:nowrap;min-height:24px;min-width:26px;padding:2px 8px;
  border:1px solid var(--faint);border-radius:3px;transition:color .12s,border-color .12s,background .12s,transform .08s}
.det .prj button:hover{color:var(--acc);border-color:var(--acc);background:rgba(0,229,255,.06)}
.det .prj button:active{transform:scale(.95)}
/* used in: the last few projects on one line, each opens VS Code there as this account */
.det .used{gap:4px 14px;flex-wrap:wrap;overflow:hidden}
.det .used button{display:inline-flex;gap:5px;align-items:baseline;color:var(--fg);font-size:12px;min-width:0;max-width:100%}
.det .used button b{flex:none;max-width:140px}
.det .used button:hover b{color:var(--acc)}
.det .used .more{font-size:11px;color:var(--dim);font-style:normal}
.usd.none{--c:var(--dim);text-shadow:none}
.gemini .rate b,.gemini .rate span{display:none}
.det b.acc{color:var(--acc)}
/* meter: label · bar · % on one line, "↻ time to reset" right under its own bar */
/* one label width for 5h / 7d / 30d, so the bars start in line; only a long name (primary) widens it */
.m{display:grid;grid-template-columns:22px 1fr 40px;align-items:center;gap:4px 8px}
.m.alt{grid-template-columns:auto 1fr 40px}
.m .t{grid-column:2/4;color:var(--dim);font-size:10.5px;white-space:nowrap;line-height:1}
.m .t.urgent{color:var(--acc)}
.m.max .t{color:var(--fg)}
.m.max.gate .t{color:#fff;font-weight:600;font-size:11.5px}
/* ▶ on an idle label: start that window now */
.m .t .go{margin:-5px -4px -5px 2px;padding:5px 6px;font-size:10px;line-height:1;color:var(--warn);cursor:pointer;border-radius:3px}
.m .t .go:hover:not(:disabled){background:rgba(0,229,255,.1)}
.m .t .go:hover{color:var(--acc);text-shadow:0 0 6px var(--acc)}
.m .t .go:disabled{color:var(--dim);text-shadow:none;cursor:wait}
.m .k{font-size:10px;color:var(--dim)}
.bar{height:4px;background:var(--faint);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 6px var(--c)}
.m .v{text-align:right;font-weight:600;color:var(--c)}
.m.max .bar{background:var(--red)}
.m.max .bar i{display:none}
.m.max .v{color:var(--red);font-size:11px;letter-spacing:.04em}
.stale .m{opacity:.4}
.need{grid-column:2/4;display:flex;gap:12px;align-items:center;color:var(--dim);overflow:hidden;white-space:nowrap}
.need button{color:var(--acc);font-weight:600}
.need span{overflow:hidden;text-overflow:ellipsis;font-size:11px}
.need.identity{align-items:flex-start;flex-direction:column;gap:5px;white-space:normal;color:var(--warn)}
.need.identity span{overflow:visible;overflow-wrap:anywhere}
#det{font-size:16px}
#det.on{color:var(--acc)}
.acct{cursor:pointer}
/* open: same padding/alignment as closed, so the name and meters stay put; the details go below */
.acct.open{height:auto}
.det{display:none;grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px;margin-top:10px;
  padding:10px 0 2px;border-top:1px dashed var(--faint);font-size:12px;cursor:text;user-select:text}
.acct.open .det{display:grid;animation:det-in .18s ease-out}
@keyframes det-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ch{position:absolute;right:8px;bottom:4px;font-size:9px;color:var(--dim);opacity:.25;transition:opacity .15s,color .15s;pointer-events:none}
.acct:hover .ch,.acct.open .ch{opacity:.8;color:var(--acc)}
/* the details' first line: plan · login · workspace · Chrome, quiet */
.det .dhead b{color:var(--dim);font-size:11px}
/* a gap before a new group of lines */
.det .gap{margin-top:6px}
.det .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.det .acts button{color:var(--dim);white-space:nowrap;font-size:11px;padding:5px 12px;min-height:28px;border:1px solid var(--faint);border-radius:3px;
  transition:color .12s,border-color .12s,background .12s,transform .08s}
.det .acts button:hover{color:var(--acc);border-color:var(--acc);background:rgba(0,229,255,.06)}
.det .acts button:active{transform:scale(.96)}
.det .acts .del{margin-left:auto}
.det .acts .del:hover,.det .acts .del.arm{color:var(--red);border-color:var(--red);background:rgba(255,46,99,.06)}
button{transition:color .12s}
#sort.on{color:var(--acc)}
#sortm{position:fixed;top:44px;right:10px;z-index:25;display:none;min-width:230px;background:var(--bg);border:1px solid var(--faint);
  box-shadow:0 8px 24px rgba(0,0,0,.6);padding:4px 0}
#sortm.on{display:block}
#sortm button{display:block;width:100%;text-align:left;padding:7px 14px;color:var(--dim);white-space:nowrap}
#sortm button:hover{color:var(--fg);background:rgba(0,229,255,.05)}
#sortm button.on{color:var(--acc)}
#sortm button.on::before{content:"› "}
/* plans: every subscription, Claude and Codex apart, soonest renewal first in each */
.plh{display:flex;justify-content:space-between;padding:12px 12px 6px 18px;font-size:10px;letter-spacing:.12em;color:var(--dim);border-bottom:1px solid var(--line)}
.plh span{color:var(--faint)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 64px 118px 58px 34px;align-items:center;gap:10px;min-height:44px;
  padding:0 12px 0 18px;border-bottom:1px solid var(--line);cursor:pointer}
.pl:hover{background:rgba(0,229,255,.03)}
.pl b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{font-style:normal;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .dt{white-space:nowrap}
.pl .dl{text-align:right;white-space:nowrap;color:var(--dim)}
.pl .soon{color:var(--warn)}.pl .gone{color:var(--red)}
.pl.unk .dt,.pl.unk .dl{color:var(--faint)}
.pl button{color:var(--dim);min-height:26px;min-width:26px;padding:2px 8px;border:1px solid transparent;border-radius:3px;transition:color .12s,border-color .12s,background .12s}
.pl button:hover{color:var(--acc);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.06)}
.plnote{padding:12px 18px;color:var(--dim);font-size:11px;line-height:1.7}
@media (max-width:470px){ .pl{grid-template-columns:minmax(0,1fr) 104px 46px 26px;padding-left:14px} .pl em{display:none} }
.det div{display:grid;grid-template-columns:84px 1fr;gap:8px;min-width:0}
.det div.wide{grid-column:1/-1}
.det span{color:var(--dim)}
.det b{font-weight:400;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det b.red{color:var(--red)}.det b.warn{color:var(--warn)}.det b.dim{color:var(--dim)}
.det .banked-credit{grid-template-columns:minmax(0,1fr);gap:3px;padding:3px 0}
.det .banked-credit span,.det .banked-credit b{white-space:normal;overflow-wrap:anywhere}
.empty{padding:48px 18px;color:var(--dim);text-align:center;line-height:2}
.empty button{color:var(--acc);font-size:15px}

/* add sheet */
#sheet{position:fixed;left:0;right:0;top:48px;bottom:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
#sheet.on{display:flex}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;color:var(--dim);letter-spacing:.14em;font-size:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line)}
.opt:hover{background:rgba(0,229,255,.05)}
.opt .i{width:16px;color:var(--acc);text-align:center}
.opt .t{color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .s{color:var(--dim);font-size:11px;white-space:nowrap}
.opt.restore .i{color:var(--warn)}
.opt input{flex:1;background:none;border:0;border-bottom:1px solid var(--faint);outline:0;color:#fff;font:inherit;padding:2px 0}
.opt input:focus{border-color:var(--acc)}

/* command line (log only shows while you use it) */
#log{max-height:0;overflow-y:auto;transition:max-height .2s;background:rgba(0,0,0,.4);user-select:text;font-size:12px}
.logopen #log{max-height:170px;padding:8px 18px;border-top:1px solid var(--line)}
#log div{white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.out{color:var(--acc)!important}.ok{color:var(--ok)!important}.warn{color:var(--warn)!important}
.crit,.error{color:var(--red)!important}.echo{color:var(--fg)!important}.sys{color:var(--fg)!important}
.prompt{display:flex;gap:10px;align-items:center;padding:10px 18px 12px;border-top:1px solid var(--line)}
.ps{color:var(--red)}
#cmd{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--acc)}
#cmd::placeholder{color:var(--faint)}
#toast{position:fixed;left:18px;right:18px;bottom:56px;padding:9px 12px;background:#0d1417;border-left:2px solid var(--acc);
  color:var(--fg);font-size:12px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:20;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:none}
#toast.bad{border-color:var(--red);color:var(--red)}
#toast.good{border-color:var(--ok)}
/* ---- adaptive layout: the window can be dragged to any size ---- */
@media (max-width:470px){
  header{gap:12px;padding-left:14px}.acct{gap:10px;padding:0 14px}.m{grid-template-columns:16px 1fr 36px;gap:4px 6px}
  .det{grid-template-columns:1fr}.det div{grid-template-columns:70px 1fr}
}
/* header: logo · CLAUDE · CODEX · PLANS · tools must fit the default 520px window (and narrower) */
@media (max-width:640px){ header{gap:12px} .logo i{display:none} }
@media (max-width:500px){ .logo{display:none} .tab{letter-spacing:.1em} }
@media (max-width:440px){ .hb{min-width:26px;padding:0 4px} .tab{letter-spacing:.06em} }
@media (max-width:410px){ #ver{display:none!important} }
@media (max-width:400px){ #age{display:none!important} }
@media (max-width:345px){ #sort,#det{display:none} }   /* still there as the sort / d commands */
@media (max-width:360px){ header{gap:10px;padding-left:12px} .tab{letter-spacing:.02em} #age,#ver{display:none!important} }
@media (max-width:440px){          /* two-line rows: name, then both meters */
  .acct,.acct.codex{grid-template-columns:1fr 1fr;grid-template-rows:none;height:auto;padding:9px 14px 10px;gap:6px 22px}
  .acct .who{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap}.need{grid-column:1/-1}
  .rate span{display:inline}.dial .rate{width:auto}
  .codex .dial{flex-basis:100%}
}
@media (max-height:300px){ .prompt{display:none} .logopen #log{max-height:90px} }
@media (max-height:220px){ header{height:40px}.tab{height:40px} }
/* resize handles (frameless window has no OS border) */
.rz{position:fixed;z-index:30;display:none}
.native .rz{display:block}
.rz.n{top:0;left:10px;right:10px;height:4px;cursor:ns-resize}
.rz.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.nw{left:0;top:0;width:10px;height:10px;cursor:nwse-resize}
.rz.se{right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize}
.rz.ne{right:0;top:0;width:10px;height:10px;cursor:nesw-resize}
.rz.sw{left:0;bottom:0;width:12px;height:12px;cursor:nesw-resize}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rate,.rate *{animation:none!important}}
</style>

<body>
<header id="top">
  <div class="logo pywebview-drag-region">R<i>EDLINE</i><b>//</b></div>
  <button class="tab" data-tab="claude">CLAUDE<sup id="nclaude"></sup></button>
  <button class="tab" data-tab="codex">CODEX<sup id="ncodex"></sup></button>
  <button class="tab hide" data-tab="gemini" title="Gemini CLI logins: quota left per model">GEMINI<sup id="ngemini"></sup></button>
  <button class="tab" data-tab="plans" title="subscriptions: which one renews/ends first">PLANS</button>
  <div class="sp pywebview-drag-region"></div>
  <div class="tools">
  <button class="hb act" id="wake" title="some accounts need a login — wake them">⚡</button>
  <button class="hb" id="age" title="sync now">⟳</button>
  <button class="hb" id="sort" title="sort">⇅</button>
  <button class="hb" id="det" title="details (d)">⋯</button>
  <button class="hb" id="ver" title="check for updates"></button>
  <button class="hb act" id="plus" title="add account">+</button>
  <button class="hb win" id="bmin" title="minimize">_</button>
  <button class="hb win x" id="bhide" title="hide (Esc)">×</button>
  </div>
</header>
<div id="weeklyNotice" role="status" aria-live="polite"></div>
<div id="wsNotice" role="status"></div>
<main id="list"></main>
<div id="sortm"></div>
<div id="sheet"></div>
<div id="log"></div>
<div class="prompt"><span class="ps">›</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder=""></div>
<div id="toast"></div>
<div class="rz n" data-e="n"></div><div class="rz s" data-e="s"></div><div class="rz w" data-e="w"></div><div class="rz e" data-e="e"></div>
<div class="rz nw" data-e="nw"></div><div class="rz ne" data-e="ne"></div><div class="rz sw" data-e="sw"></div><div class="rz se" data-e="se"></div>
<script>
const BOOT = /*__BOOT__*/{};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
let DATA = {usages: []}, lastEvent = 0, lastRevision = "", linkOk = true;
let TAB = store.get("redline.tab", "claude");

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"X-Redline-Token": BOOT.token, "Content-Type": "application/json"}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function pull(force) {
  try {
    const d = await api(`api/usage?since=${lastEvent}${force ? "&force=1" : ""}`);
    linkOk = true;
    for (const e of d.events) {
      lastEvent = Math.max(lastEvent, e.id);
      log(e.text, e.level);
      if (e.alert || /^(wake done|updated|installing)/.test(e.text) || / logged in| login failed| no login /.test(e.text))
        toast(e.text, e.level === "crit" || e.level === "error" ? "bad" : e.level === "ok" ? "good" : "");
    }
    DATA = {...d, usages: (d.usages || []).map(projectStale)};
    renderVersion();
    // A countdown job changes meta between usage polls; its busy state must be visible immediately.
    const revision = JSON.stringify([DATA.fetched_at, DATA.usages, DATA.meta]);
    if (revision !== lastRevision && !editing) { lastRevision = revision; render(); }
  } catch (e) { linkOk = false; tick(); }
}
// Old numbers (fetch failed, e.g. an idle account's token expired): a window whose reset time
// has passed since then has started over, so show it as reset rather than the old percentage.
function projectStale(u) {
  if (!u.stale) return u;
  const now = Date.now();
  return {...u, windows: u.windows.map(w => w.resets_at && new Date(w.resets_at) <= now
    ? {...w, used_percent: 0, resets_at: null} : w)};
}
async function action(body, quiet) {
  if (!BOOT.actions) { toast("read-only console", "bad"); return false; }
  // names are unique per provider: actions from a tab refer to that tab's accounts
  if (!body.provider && body.action !== "scan" && body.action !== "update" && TAB !== "plans") body = {...body, provider: TAB};
  try {
    const r = await api("api/action", {method: "POST", body: JSON.stringify(body)});
    log(r.message, r.ok ? "out" : "error");
    if (!quiet || !r.ok) toast(r.message.split("\n").pop(), r.ok ? "" : "bad");
    if (["add", "add-profile", "remove", "restore", "scan", "bind", "use"].includes(body.action)) setTimeout(() => pull(false), 1200);
    if (body.action === "renew" && r.ok) setTimeout(() => pull(false), 150);
    return r.ok;
  } catch (e) { log("failed: " + e.message, "error"); toast("failed: " + e.message, "bad"); return false; }
}

/* ---------- formatting ---------- */
const lvl = p => p == null ? "var(--dim)" : p >= 90 ? "var(--red)" : p >= 70 ? "var(--warn)" : "var(--ok)";
// MAX only when truly used up; every percentage shown is rounded down (99.6 reads 99%, never 100%)
const spent = p => p != null && p >= 100;
const pct = p => p == null ? "?" : Math.floor(p) + "%";
function span(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${pad(m)}m` : `${m}m`;
}
const ago = s => (s = Math.max(0, Math.floor(s))) < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`;
const left = iso => iso ? (new Date(iso) - Date.now()) / 1000 : null;
const short = u => u.windows.find(w => w.name === "5h") || u.windows[0];
function best(provider) {
  const c = DATA.usages.filter(u => u.ok && !identityMismatch(u) && u.provider === provider && u.windows.length && !u.windows.some(w => spent(w.used_percent)));
  c.sort((a, b) => (short(a)?.used_percent ?? 999) - (short(b)?.used_percent ?? 999));
  return c[0];
}
// Only these failures are fixed by logging in; the rest (403, offline, rate limit...) are not.
const AUTH_ERR = /not logged in|expired|unauthorized|signed out|user:profile|API key|refresh token|log in again|no .*tokens/i;
const failed = u => !u.ok && !u.stale;
const needsLogin = u => identityMismatch(u) || (failed(u) && AUTH_ERR.test(u.error || ""));
// Old numbers kept on screen, but the token behind them has expired: still worth a ⚡ / ⟳ renew.
const lapsed = u => !u.ok && u.stale && AUTH_ERR.test(u.error || "");
const reauth = u => needsLogin(u) || lapsed(u);
// The login is fine but its plan (Claude Free) has no Claude Code: no login or wake can help.
const noClaudeCode = u => !u.ok && /not included in this plan/.test(u.error || "");

/* ---------- render ---------- */
// "↻ 2h 08m" = resets in 2h 08m. Missing Codex reset data needs an explicit server classification.
const resetText = l => l == null ? "idle" : l > 0 ? "↻ " + span(l) : "↻ now";
function meter(w, label, weekly = null, go = "", gate = false) {
  if (!w) return `<div class="m none"></div>`;   // e.g. a Codex plan without a 5h window: leave the slot empty
  const p = w.used_percent, l = left(w.resets_at);
  const tip = `${w.name} ${pct(p)}${w.resets_at ? " · resets in " + span(l) + " (" + new Date(w.resets_at).toLocaleString() + ")" : " · " + (weekly ? weekly.message : "window not started")}`;
  // weekly window resetting soon with quota left = "use it or lose it"
  const urgent = label === "7d" && l != null && l < 36 * 3600 && (p ?? 100) < 80;
  const idle = weekly && weekly.state === "unstarted" ? "待启动" : weekly && weekly.state === "unknown" ? "待确认" : resetText(l);
  const t = `<span class="t${urgent ? " urgent" : ""}" data-reset="${esc(w.resets_at || "")}">${l == null ? idle : resetText(l)}${go}</span>`;
  const cls = label.length > 3 ? " alt" : "";
  // used up: a full red bar; the window the account waits on ("gate") has its countdown brighter
  if (spent(p)) return `<div class="m max${cls}${gate ? " gate" : ""}" title="${esc(tip)}"><span class="k">${esc(label)}</span><div class="bar"></div><span class="v">MAX</span>${t}</div>`;
  const width = p == null ? 0 : Math.min(100, Math.max(0, p));
  return `<div class="m${cls}" style="--c:${lvl(p)}" title="${esc(tip)}"><span class="k">${esc(label)}</span>
    <div class="bar"><i style="width:${width}%"></i></div><span class="v">${pct(p)}</span>${t}</div>`;
}
const infoOf = u => ((DATA.meta || {}).accounts || {})[`${u.provider}:${u.account}`] || {};
const identityMismatch = u => infoOf(u).login_mismatch === true;
const identityMessage = u => `登录账号不符 · 实际：${infoOf(u).email || u.email || "未知"} · 预期：${infoOf(u).expected_email || "未知"}`;
const extraEntries = u => Object.entries(u.extra || {}).filter(([k, v]) => k !== "banked_resets" && v != null && typeof v !== "object");
function bankedResetText(u) {
  const b = (u.extra || {}).banked_resets;
  if (!b || (!Number.isFinite(b.available) && !Number.isFinite(b.applicable) && !bankedResetCredits(u).length)) return "";
  return Number.isFinite(b.available) ? `${b.available} 次` : "总数未知";
}
function bankedResetCredits(u) {
  const credits = (u.extra || {}).banked_resets?.credits;
  return Array.isArray(credits) ? credits.filter(c => c && typeof c === "object") : [];
}
function bankedExpiryText(iso) {
  const date = iso ? new Date(iso) : null;
  if (!date || !Number.isFinite(date.getTime())) return "到期时间未知";
  const seconds = (date - Date.now()) / 1000;
  const exact = date.toLocaleString(undefined, {year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZoneName: "short"});
  return `${exact} · ${seconds <= 0 ? "已到期" : "剩余 " + (seconds < 60 ? "不足 1 分钟" : span(seconds))}`;
}
function bankedResetDetails(u) {
  const b = (u.extra || {}).banked_resets;
  if (!b) return "";
  const credits = bankedResetCredits(u);
  const rows = credits.map((c, i) => `<div class="wide banked-credit"><span>${esc(`Reset #${i + 1}${c.title ? " · " + c.title : ""}`)}</span>`
    + `<b data-expiry="${esc(c.expires_at || "")}">${esc(bankedExpiryText(c.expires_at))}</b></div>`);
  const missing = Number.isFinite(b.available) ? Math.max(0, b.available - credits.length) : null;
  if (missing || (!Array.isArray(b.credits) && b.available !== 0)) {
    rows.push(`<div class="wide banked-credit"><span>到期明细</span><b>${missing ? `另有 ${missing} 次未返回到期明细` : "未取得到期明细"}，请稍后刷新。</b></div>`);
  }
  return rows.join("");
}
// window names as people read them: "weekly weekly_all" -> "7d all models", "weekly Fable" -> "7d Fable"
function niceName(n) {
  n = String(n || "");
  const m = n.match(/^weekly\s+(.+)$/i);
  if (m) return "7d " + (/^weekly_all$/i.test(m[1]) ? "all models" : m[1].replace(/_/g, " "));
  return n.replace(/_/g, " ");
}
const MAIN_WINDOW = /^(?:primary|secondary|\d+(?:\.\d+)?[hd])$/;
// Used up: a main window (5h, 7d...) is at 100%. Back once every full one has reset.
function blockedOf(u) {
  if (!["claude", "codex"].includes(u.provider) || identityMismatch(u) || !u.windows) return null;
  const full = u.windows.filter(w => MAIN_WINDOW.test(w.name) && spent(w.used_percent));
  if (!full.length) return null;
  const at = full.every(w => w.resets_at) ? full.map(w => w.resets_at).sort((a, b) => new Date(a) - new Date(b)).pop() : null;
  return {windows: full, at};
}
function quotaMeters(u) {
  if (u.provider === "gemini") {
    if (!u.windows.length) return `<div class="need"><span>未返回额度</span></div>`;
    return [u.windows[0], u.windows[1]].map(w => meter(w, w ? w.name : "")).join("");
  }
  const main = u.windows.filter(w => MAIN_WINDOW.test(w.name));
  if (!main.length) return `<div class="need"><span>未返回额度窗口</span></div>`;
  const slots = [main.find(w => w.name === "5h"), main.find(w => w.name === "7d")];
  const other = main.filter(w => !["5h", "7d"].includes(w.name));
  for (const w of other) {   // a window of a day or more goes under 7d, a shorter one under 5h
    const want = /d$/.test(w.name) || w.name === "secondary" ? 1 : 0;
    const at = !slots[want] ? want : !slots[1 - want] ? 1 - want : -1;
    if (at >= 0) slots[at] = w;
  }
  const b = blockedOf(u);
  const gate = w => !!b && b.windows.includes(w) && (!b.at || w.resets_at === b.at);
  return slots.map((w, i) => meter(w, w?.name || (i ? "7d" : "5h"), w?.name === "7d" ? weeklyOf(u) : null, startControl(u, w), gate(w))).join("");
}
// One entry point per window: a small ▶ on the meter's idle label (Claude 5h, Codex weekly).
function startControl(u, w) {
  const [act, busy, can] = w?.name === "5h" && u.provider === "claude" ? ["start-5h", start5hBusy(u), canStart5h(u)]
    : w?.name === "7d" && u.provider === "codex" ? ["start-countdown", countdownBusy(u), canStartWeekly(u)] : [];
  if (busy) return `<button class="act go" data-act="${act}" disabled title="正在开始计时">…</button>`;
  return can ? `<button class="act go" data-act="${act}" title="开始计时">▶</button>` : "";
}
const start5hPending = new Set();
const start5hOf = u => ((DATA.meta || {}).start5h || {})[accountKey(u)] || {};
const start5hBusy = u => start5hPending.has(accountKey(u)) || ["starting", "verifying"].includes(start5hOf(u).state);
// An idle 5h window (no reset time yet) on a live login whose weekly quota isn't spent.
function canStart5h(u) {
  if (u.provider !== "claude" || !u.ok || u.stale || identityMismatch(u)) return false;
  const five = u.windows.find(x => x.name === "5h"), week = u.windows.find(x => x.name === "7d");
  return !!five && five.resets_at == null && !spent(five.used_percent) && !spent(week?.used_percent);
}
async function start5h(u) {
  if (!BOOT.actions || start5hBusy(u) || !canStart5h(u)) return;
  const key = accountKey(u);
  start5hPending.add(key); render();
  try {
    await action({action: "start-5h", provider: "claude", name: u.account}, true);
    await pull(false);
  } finally {
    start5hPending.delete(key);
    if (!editing) render();
  }
}
const accountKey = u => `${u.provider}:${u.account}`;
const countdownPending = new Set();
const countdownOf = u => ((DATA.meta || {}).countdown || {})[accountKey(u)] || {};
const countdownBusy = u => countdownPending.has(accountKey(u)) || ["starting", "verifying"].includes(countdownOf(u).state);
function weeklyOf(u) {
  if (u.provider !== "codex") return null;
  const status = u.weekly_countdown;
  // API-key accounts do not have a subscription window, including when usage cannot be fetched.
  if (status?.state === "unavailable") return status;
  if (identityMismatch(u)) return {state: "unknown", message: "登录账号不符，请重新登录预期账号后确认 weekly 计时状态。"};
  if (!u.ok || u.stale) return {state: "unknown", message: "当前没有实时用量，刷新或重新登录后确认 weekly 计时状态。"};
  const w = u.windows.find(x => x.name === "7d");
  // A future reset is positive evidence of an active window, even when usage rounds to 0%.
  if (w && left(w.resets_at) > 0) return {state: "active", message: "weekly 已开始计时，重置时间：" + when(w.resets_at)};
  if (status?.state === "active") return {state: "unknown", message: "weekly 重置时间已过或缺失，刷新用量后确认当前计时状态。"};
  return status && ["active", "unstarted", "unknown", "unavailable"].includes(status.state)
    ? status : {state: "unknown", message: "未收到可确认的 weekly 计时状态。"};
}
function canStartWeekly(u) {
  const status = weeklyOf(u), w = u.windows.find(x => x.name === "7d");
  if (!status || !u.ok || u.stale || identityMismatch(u) || u.windows.some(x => spent(x.used_percent))) return false;
  return status.state === "unstarted" || (status.state === "unknown" && !!w && w.used_percent === 0 && !(left(w.resets_at) > 0));
}
function weeklyTag(u) {
  const status = weeklyOf(u);
  if (!status) return "";
  const job = countdownOf(u), busy = countdownBusy(u);
  if (!busy && status.state !== "unstarted" && status.state !== "unknown") return "";
  const error = job.state === "error";
  const label = busy ? (job.state === "verifying" ? "weekly 确认中…" : "weekly 开启中…") : error ? "weekly 开启未确认"
    : status.state === "unstarted" ? "weekly 未开始" : "weekly 待确认";
  const tip = [status.message, job.message].filter(Boolean).join(" · ");
  return `<div class="weekly ${busy ? "busy" : error ? "error" : status.state}" title="${esc(tip)}"><span>${label}</span></div>`;
}
async function startWeekly(u) {
  if (!BOOT.actions || countdownBusy(u) || !canStartWeekly(u)) return;
  const key = accountKey(u);
  countdownPending.add(key); render();
  try {
    await action({action: "start-countdown", provider: "codex", name: u.account}, true);
    await pull(false);
  } finally {
    countdownPending.delete(key);
    if (!editing) render();
  }
}
/* subscriptions: when the paid period ends. Claude only reports when the subscription started;
   monthly plans renew on that day each month, so roll it forward (marked ~ = estimate). */
function addMonths(d, n) {
  const r = new Date(d), day = r.getDate();
  r.setDate(1); r.setMonth(r.getMonth() + n);
  r.setDate(Math.min(day, new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate()));
  return r;
}
function rollForward(anchor) {
  const now = Date.now();
  if (anchor.getTime() > now) return anchor;
  for (let n = 1; n < 1200; n++) { const d = addMonths(anchor, n); if (d.getTime() > now) return d; }
  return null;
}
const isFree = u => typeof u.plan === "string" && u.plan.trim().toLowerCase() === "free";
function renewOf(u) {
  if (identityMismatch(u)) return null;
  const info = infoOf(u);
  if (info.renews) return {at: rollForward(new Date(info.renews + "T00:00:00")), est: false, set: true};
  if (!u.renews_at || isFree(u)) return null;   // a Free plan renews nothing (an old paid-until would roll on)

}
const openLog = on => document.body.classList.toggle("logopen", on);
let toastT;
function toast(text, kind = "") {
  const t = $("#toast"); t.textContent = text; t.className = "show " + kind;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = kind, 3500);
}

/* ---------- commands (for keyboard people; everything is also a button) ---------- */
const HELP = [
  ["claude | codex | gemini", "switch tab (Alt+1/2/3…, in the order on screen)"], ["add", "open the + panel"], ["add <name>", "new account, then log in"],
  ["login <name>", "log in via its Chrome"], ["wake", "log in / refresh this tab"], ["web <name>", "open its web page"],
  ["jack <name>", "terminal as <name>"], ["use <name>", "◆ make it the login VS Code uses"], ["code <name> <folder>", "VS Code window as <name>"], ["plans", "subscriptions, Claude and Codex apart, soonest renewal first"], ["renew <name> <date>", "set when a subscription renews/ends (- = auto)"], ["d | details", "expand all rows (or click one)"], ["sort [default|weekly|headroom|name|renews]", "row order"], ["expect [<name>] <days>", "how long an account should last (default 2d); 1.5x faster blows the gauge"], ["fit", "let the height follow the content again"], ["log", "open the log file (send it when reporting a bug)"], ["rename <old> <new>", "rename (or double-click)"], ["rm <name..> -y", "remove (files kept)"], ["restore <name>", "undo a removal"],
  ["scan [all]", "find logins on this PC"], ["bind <name> <email>", "pin a Chrome profile"], ["ls | r | update | clear", ""],
];
const COMMANDS = ["help","claude","codex","gemini","details","add","login","wake","web","jack","use","code","rename","rm","restore","removed","scan","bind","profiles","ls","sync","update","clear","hide"];
const tabNames = () => DATA.usages.filter(u => u.provider === TAB).map(u => u.account);
const hist = []; let hi = 0;
async function run(line) {
  const [c, ...a] = line.trim().split(/\s+/);
  if (!c) return;
  openLog(true); log("› " + line.trim(), "echo");
  const need = u => { if (!a[0]) { log("usage: " + u, "error"); return false; } return true; };
  switch (c.toLowerCase()) {
    case "help": case "?": HELP.forEach(([k, v]) => log(k.padEnd(22) + v, "out")); break;
    case "claude": case "codex": case "gemini": setTab(c.toLowerCase()); openLog(false); break;
    case "add":
      if (!a[0]) { openLog(false); openSheet(); break; }
      { const [prov, name] = a.length > 1 ? [a[0], a[1]] : [accountTab(), a[0]];
        if (await action({action: "add", provider: prov, name}, true)) { setTab(prov); action({action: "login", name}); } }
      break;
    case "login": if (need("login <name>")) await action({action: "login", name: a[0]}); break;
    case "wake": if (a[0] === "cancel") { await action({action: "wake-cancel"}); break; }
      { const names = a.length ? a : tabNames();   // never an empty list: the server reads [] as "everyone"
        if (!names.length) { log(`nothing to wake on this tab (no ${TAB === "plans" ? "" : TAB + " "}accounts)`, "warn"); break; }
        await action({action: "wake", names}); }
      break;
    case "web": if (need("web <name>")) await action({action: "web", name: a[0]}, true); break;
    case "jack": case "run": if (need("jack <name>")) await action({action: "launch", name: a[0]}, true); break;
    case "use": case "default": if (need("use <name>")) { if (await action({action: "use", name: a[0]})) setTimeout(() => pull(false), 800); } break;
    case "renew": if (!a[0]) { log("usage: renew <name> YYYY-MM-DD   (or - to go back to the reported date)", "error"); break; }
      await action({action: "renew", name: a[0], date: a[1] || ""}); break;
    case "plans": case "subs": setTab("plans"); openLog(false); break;
    case "code": if (a.length < 2) { log("usage: code <name> <folder>", "error"); break; }
      await action({action: "code", name: a[0], path: a.slice(1).join(" ")}, true); break;
    case "rm": case "remove": {
      const names = a.filter(x => x !== "-y");
      if (!names.length) { log("usage: rm <name..> -y", "error"); break; }
      if (!a.includes("-y")) { log(`confirm: rm ${names.join(" ")} -y`, "warn"); break; }
      for (const n of names) await action({action: "remove", name: n}); break;
    }
    case "log": case "logs": await action({action: "open-log"}); break;
    case "expect": setExpect(a); break;
    case "fit":
      if (native()) { await window.pywebview.api.reset_size(); fitAuto = true; fitHeight(); }
      log("window height follows the content again", "ok"); break;
    case "sort": setSort(a[0] || Object.keys(SORTS)[(Object.keys(SORTS).indexOf(SORT) + 1) % Object.keys(SORTS).length]); break;
    case "d": case "details": setDetails(!DETAILS); openLog(false); break;
    case "rename": case "mv": if (a.length < 2) { log("usage: rename <old> <new>", "error"); break; }
      await action({action: "rename", name: a[0], new: a[1]}); break;
    case "restore": case "undo": if (need("restore <name>")) await action({action: "restore", name: a[0]}); break;
    case "removed": await action({action: "removed"}, true); break;
    case "scan": await action({action: "scan", all: a[0] === "all"}); break;
    case "bind": if (a.length < 2) { log("usage: bind <name> <google email | Profile 2 | none>", "error"); break; }
      await action({action: "bind", name: a[0], profile: a.slice(1).join(" ")}); break;
    case "profiles": await action({action: "profiles"}, true); break;
    case "ls": DATA.usages.filter(u => u.provider === TAB).forEach(u => log(`${u.account.padEnd(18)} ${u.email || ""}  ${
      u.windows.map(w => `${w.name} ${pct(w.used_percent)}`).join(" ") || u.error}`, "out")); break;
    case "r": case "sync": await pull(true); log("synced", "ok"); break;
    case "update": await checkUpdate(); break;
    case "clear": case "cls": $("#log").innerHTML = ""; openLog(false); break;
    case "hide": case "exit": hideWindow(); break;
    default: log(`unknown: ${c} (help)`, "error");
  }
}
function complete(input) {
  const parts = input.value.split(/\s+/), cur = parts[parts.length - 1].toLowerCase();
  const pool = parts.length === 1 ? COMMANDS : parts[0] === "scan" ? ["all"] : DATA.usages.map(u => u.account);
  const hits = pool.filter(x => x.toLowerCase().startsWith(cur));
  if (hits.length === 1) { parts[parts.length - 1] = hits[0]; input.value = parts.join(" ") + " "; }
  else if (hits.length > 1) { openLog(true); log(hits.join("  "), "out"); }
}

/* ---------- events ---------- */
$("#cmd").addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter") { const v = el.value; if (v.trim()) { hist.push(v); hi = hist.length; } el.value = ""; run(v); }
  else if (e.key === "ArrowUp") { if (hi > 0) el.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); el.value = hist[hi] || ""; e.preventDefault(); }
  else if (e.key === "Tab") { e.preventDefault(); complete(el); }
});
document.addEventListener("keydown", e => {
  if (editing) return;
  if (e.key === "Escape") {
    if ($("#sheet").classList.contains("on")) closeSheet();
    else if (document.body.classList.contains("logopen")) openLog(false);
    else if (DETAILS || document.querySelector(".acct.open")) setDetails(false);   // collapse everything
    else hideWindow();
    return;
  }
  if (e.altKey && /^[1-9]$/.test(e.key)) {   // the Nth tab on screen (GEMINI only when there is one)
    const shown = TABS.filter(t => { const el = document.querySelector(`.tab[data-tab="${t}"]`); return el && !el.classList.contains("hide"); });
    if (shown[+e.key - 1]) setTab(shown[+e.key - 1]);
    return;
  }
  if (document.activeElement.tagName !== "INPUT" && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) $("#cmd").focus();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));
$("#wsNotice").onclick = () => {   // the notices: one line, or all of them
  const el = $("#wsNotice"), open = !el.classList.contains("open");
  el.classList.toggle("open", open); store.set("redline.notices", open ? "1" : "0");
  render();
};
$("#wsNotice").classList.toggle("open", store.get("redline.notices", "0") === "1");
$("#age").onclick = async () => { $("#age").textContent = "…"; await pull(true); };
$("#ver").onclick = checkUpdate;
$("#det").onclick = () => setDetails(!DETAILS);
$("#det").classList.toggle("on", DETAILS);
$("#sort").onclick = e => { e.stopPropagation(); $("#sortm").classList.toggle("on"); };
$("#sortm").onclick = e => {
  const b = e.target.closest("[data-sort]");
  if (!b) return;
  $("#sortm").classList.remove("on");
  if (TAB === "plans") setTab(accountTab());   // plans have their own order
  setSort(b.dataset.sort);
};
document.addEventListener("click", e => { if (!e.target.closest("#sortm")) $("#sortm").classList.remove("on"); });
setSort(SORT, false);
$("#plus").onclick = () => $("#sheet").classList.contains("on") ? closeSheet() : openSheet();
$("#wake").onclick = () => {
  // from the current DATA, which can be newer than the ⚡ count on screen: may have become empty
  const names = DATA.usages.filter(u => u.provider === TAB && reauth(u)).map(u => u.account);
  if (!names.length) { toast("nothing to wake on this tab"); return; }
  action({action: "wake", names});
};
$("#list").addEventListener("click", e => {
  const pl = e.target.closest(".pl");
  if (pl) {
    if (e.target.closest("[data-act=renew]")) return renewPrompt(pl.dataset.prov, pl.dataset.name);
    return setTab(pl.dataset.prov);
  }
  if (!e.target.closest("[data-act]")) {
    openLog(false);
    const c = e.target.closest(".acct");
    // A click anywhere on the row (details included) opens/closes it, in place (no
    // re-render). On the name, wait a moment so a double-click can mean "rename".
    if (!c || editing || getSelection().toString()) return;
    if (e.target.closest(".nm")) {
      clearTimeout(nameClick);
      nameClick = setTimeout(() => toggleRow(c), 260);
    } else toggleRow(c);
    return;
  }
  const b = e.target.closest("[data-act]"), card = b.closest(".acct"), name = card.dataset.name;
  if (b.dataset.act === "del") {
    if (!b.classList.contains("arm")) {   // first click arms, second removes
      b.classList.add("arm"); b.textContent = "sure?";
      setTimeout(() => { b.classList.remove("arm"); b.textContent = b.dataset.label || "✕"; }, 3000);
      return;
    }
    card.classList.add("gone");
    action({action: "remove", name}, true).then(ok => {
      if (ok) toast(`removed ${name} · type "restore ${name}" or use + to undo`);
      else card.classList.remove("gone");
    });
    return;
  }
  if (b.dataset.act === "rename") return startRename(card);
  if (b.dataset.act === "renew") return renewPrompt(TAB, name);
  if (b.dataset.act === "expect") return expectPrompt(TAB, name);
  if (b.dataset.act === "retry") { toast("syncing…"); return pull(true); }
  if (b.dataset.act === "wake1") return action({action: "wake", names: [name]});  // renew first, log in only if that fails
  if (b.dataset.act === "code") return action({action: "code", name, path: b.dataset.path}, true);
  if (b.dataset.act === "console") return action({action: "console-connect", provider: "claude", name});
  if (b.dataset.act === "use") return action({action: "use", name}).then(ok => ok && setTimeout(() => pull(false), 800));
  if (b.dataset.act === "start-countdown") {
    if (b.disabled) return;
    const u = DATA.usages.find(u => u.provider === "codex" && u.account === name);
    if (u) return startWeekly(u);
    return;
  }
  if (b.dataset.act === "start-5h") {
    if (b.disabled) return;
    const u = DATA.usages.find(u => u.provider === "claude" && u.account === name);
    if (u) return start5h(u);
    return;
  }
  if (b.dataset.act === "usage") return action({action: "web", provider: "codex", name, usage: true}, true);
  const map = {web: "web", jack: "launch", login: "login"};
  action({action: map[b.dataset.act], provider: TAB, name}, b.dataset.act !== "login");
});

/* ---------- native window (pywebview) ---------- */
const native = () => window.pywebview && window.pywebview.api;
function hideWindow() { if (native()) window.pywebview.api.hide(); }
window.addEventListener("pywebviewready", () => { document.body.classList.add("native"); setTimeout(fitHeight, 300); });

/* Moving the window: pywebview's own drag, only from .pywebview-drag-region (the logo and the
   header's empty gap), so pressing a tab or a header button never drags it. */

/* ---------- window size ----------
   Drag an edge or a corner. The width you set is kept. Dragging the top or bottom edge sets the
   height by hand: from then on it stays as you left it (`fit` hands it back to the content).
   Until then the height follows the content, with the top edge held still: it grows and shrinks
   downward only, up to the bottom of the screen (then the list scrolls). */
let fitAuto = BOOT.fit_height !== false, resizing = false;
document.querySelectorAll(".rz").forEach(h => h.addEventListener("pointerdown", e => {
  if (!native() || e.button !== 0) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
  const edge = h.dataset.e, x0 = e.screenX, y0 = e.screenY, w0 = innerWidth, h0 = innerHeight;
  const byHeight = edge.includes("n") || edge.includes("s");
  let pending = null, busy = false, last = [w0, h0], done = false;
  resizing = true;
  const push = async () => {
    if (busy || !pending) return; busy = true;
    const [w, hh] = pending; pending = null; last = [w, hh];
    try { await window.pywebview.api.resize(w, hh, edge); } catch (err) {}
    busy = false; if (pending && !done) push();
  };
  const end = () => {   // the mouse came up, or the drag was lost: stop, whatever happened
    if (done) return; done = true; resizing = false;
    for (const [n, f] of [["pointermove", move], ["pointerup", end], ["pointercancel", end], ["lostpointercapture", end]]) h.removeEventListener(n, f);
    window.removeEventListener("blur", end);
    const [w, hh] = pending || last;
    if (byHeight) fitAuto = false;
    window.pywebview.api.save_size(w, hh, byHeight);
  };
  const move = ev => {
    if (!(ev.buttons & 1)) return end();   // the button is no longer down: never keep following the mouse
    const dx = ev.screenX - x0, dy = ev.screenY - y0;
    let w = w0, hh = h0;
    if (edge.includes("e")) w = w0 + dx;
    if (edge.includes("w")) w = w0 - dx;
    if (edge.includes("s")) hh = h0 + dy;
    if (edge.includes("n")) hh = h0 - dy;
    pending = [Math.max(300, Math.round(w)), Math.max(160, Math.round(hh))]; push();
  };
  for (const [n, f] of [["pointermove", move], ["pointerup", end], ["pointercancel", end], ["lostpointercapture", end]]) h.addEventListener(n, f);
  window.addEventListener("blur", end);
}));
// The height the content wants: more accounts, an account opened or the log shown make it taller;
// it shrinks back when they go. Never past the bottom of the screen below the window's top.
function contentHeight() {
  const header = $("header").offsetHeight + $("#weeklyNotice").offsetHeight + $("#wsNotice").offsetHeight, prompt = $(".prompt").offsetHeight || 0;
  const rows = [...$("#list").children].reduce((a, el) => a + el.offsetHeight, 0);
  const logH = document.body.classList.contains("logopen") ? $("#log").offsetHeight : 0;
  const want = header + Math.max(rows, 120) + prompt + logH + 2;
  const s = window.screen || {}, top = typeof window.screenY === "number" ? window.screenY : null;
  const room = s.availHeight && top !== null ? (s.availTop || 0) + s.availHeight - top - 8 : 0;
  return Math.max(160, room > 0 ? Math.min(want, room) : want);
}
// One resize per change, straight to the new height (no animation), never two at once.
let fitBusy = false, fitAgain = false;
async function fitHeight() {
  if (!native() || !fitAuto || resizing) return;
  if (fitBusy) { fitAgain = true; return; }
  const target = contentHeight();
  if (Math.abs(target - innerHeight) < 2) return;
  fitBusy = true;
  try { await window.pywebview.api.fit(innerWidth, target); } catch (err) {}
  fitBusy = false;
  if (fitAgain) { fitAgain = false; fitHeight(); }
}
$("#bhide").onclick = hideWindow;
$("#bmin").onclick = () => native() && window.pywebview.api.minimize();

/* ---------- boot ---------- */
if (!BOOT.actions) document.body.classList.add("noact");
log(`redline ${BOOT.version || ""}${BOOT.build ? " · build " + BOOT.build : ""} · help`, "sys");
render(); pull(false); setInterval(() => pull(false), 5000); setInterval(tick, 1000);
setTimeout(() => $("#cmd").focus(), 200);
</script>
