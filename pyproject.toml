[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.4.0"
description = "Manage multiple Claude Code / Codex accounts and monitor their subscription usage limits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10", "pywebview>=5"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redline = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
