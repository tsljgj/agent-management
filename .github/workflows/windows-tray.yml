name: windows-tray

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install ".[tray]" pytest
          python -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Self-test packaged exe
        shell: pwsh
        run: |
          $env:AGENTMAN_SELFTEST_OUT = "$PWD\selftest.json"
          $p = Start-Process dist\agentman-tray.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.webview) { throw "self-test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: agentman-tray-windows
          path: dist/agentman-tray.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agentman-tray.exe
