name: windows-tray

# Every green push to main or a claude/* branch is published as a GitHub release
# tagged build-<run_number>; installed exes pick it up through the self-updater.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-tray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp build number
        shell: pwsh
        run: |
          @"
          # Written by CI.
          BUILD = ${{ github.run_number }}
          COMMIT = "${{ github.sha }}"
          "@ | Set-Content -Encoding utf8 src/redline/_build.py

      - name: Unit tests
        run: |
          python -m pip install ".[tray]" pytest
          python -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Self-test packaged exe
        shell: pwsh
        run: |
          $env:REDLINE_SELFTEST_OUT = "$PWD\selftest.json"
          $env:REDLINE_HOME = "$PWD\selftest-home"
          $p = Start-Process dist\redline.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.webview) { throw "self-test failed (exit $($p.ExitCode))" }
          if ($r.build -ne ${{ github.run_number }}) { throw "build stamp missing (got $($r.build))" }

      - name: Restart test (what a self-update does)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:REDLINE_HOME = "$PWD\selftest-home"
          # Diagnostic: relaunch WITHOUT resetting PyInstaller's environment (old updater behaviour)
          Start-Process dist\redline.exe -ArgumentList "--self-test-restart","$PWD\restart-noreset.json","--no-reset" -Wait
          Start-Sleep -Seconds 10
          if (Test-Path restart-noreset.json) { "no-reset: $(Get-Content restart-noreset.json)" } else { "no-reset: child did NOT survive the parent exiting" }
          # Real check: the updater's relaunch must produce an independent, working instance
          Start-Process dist\redline.exe -ArgumentList "--self-test-restart","$PWD\restart.json" -Wait
          Start-Sleep -Seconds 10
          if (-not (Test-Path restart.json)) { throw "relaunched exe died after the parent exited" }
          Get-Content restart.json
          $r = Get-Content restart.json | ConvertFrom-Json
          if (-not $r.ok -or -not $r.independent) { throw "relaunched exe is not independent" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\redline.exe -Algorithm SHA256).Hash.ToLower()
          "$h  redline.exe" | Set-Content -NoNewline -Encoding ascii dist\redline.exe.sha256
          Get-Content dist\redline.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows
          path: |
            dist/redline.exe
            dist/redline.exe.sha256

      - name: Publish release (auto-update channel)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: redline build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            branch `${{ github.ref_name }}` · commit ${{ github.sha }}
          make_latest: true
          files: |
            dist/redline.exe
            dist/redline.exe.sha256

      - name: Attach to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/redline.exe
            dist/redline.exe.sha256
