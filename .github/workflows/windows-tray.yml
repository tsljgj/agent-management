name: windows-tray

# Every green push to main or a claude/* branch is published as a GitHub release
# tagged build-<run_number>; installed exes pick it up through the self-updater.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-tray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp build number
        shell: pwsh
        run: |
          @"
          # Written by CI.
          BUILD = ${{ github.run_number }}
          COMMIT = "${{ github.sha }}"
          "@ | Set-Content -Encoding utf8 src/redline/_build.py

      - name: Unit tests
        run: |
          python -m pip install ".[tray]" pytest
          python -m pytest -q

      - name: ChatGPT sign-in URL is accepted by auth.openai.com
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          from redline import codex_oauth
          _, challenge = codex_oauth.pkce()
          url = codex_oauth.authorize_url("http://127.0.0.1:1455/auth/callback", challenge, "ci-state-check")
          class Stop(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          try:
              r = urllib.request.build_opener(Stop).open(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
              status, where = r.status, r.geturl()
          except urllib.error.HTTPError as e:
              status, where = e.code, e.headers.get("Location") or e.read()[:300]
          print("authorize ->", status, str(where)[:200])
          # 400 = our parameters were rejected; 2xx/3xx = login page. 403 can be the CDN blocking CI IPs.
          assert status != 400, "auth.openai.com rejected the authorize request"
          PY

      - name: Build exe
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Self-test packaged exe
        shell: pwsh
        run: |
          $env:REDLINE_SELFTEST_OUT = "$PWD\selftest.json"
          $env:REDLINE_HOME = "$PWD\selftest-home"
          $p = Start-Process dist\redline.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.webview) { throw "self-test failed (exit $($p.ExitCode))" }
          if ($r.build -ne ${{ github.run_number }}) { throw "build stamp missing (got $($r.build))" }

      - name: Restart test (what a self-update does)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $env:REDLINE_HOME = "$PWD\selftest-home"
          function Relaunch($out, [switch]$NoReset) {
            $a = @("--self-test-restart", $out); if ($NoReset) { $a += "--no-reset" }
            $p = Start-Process dist\redline.exe -ArgumentList $a -PassThru
            # the parent only; it should exit right after spawning the child
            if (-not $p.WaitForExit(30000)) { "  parent did not exit within 30s (stuck on temp-dir cleanup)" }
            Start-Sleep -Seconds 15   # child waits 5s, then loads modules from its own unpack dir
            $left = Get-Process redline -ErrorAction SilentlyContinue
            if ($left) { "  still running (hung): $($left.Count) process(es)"; $left | Stop-Process -Force }
          }
          # Diagnostic: the old updater's relaunch (environment NOT reset)
          Relaunch "$PWD\restart-noreset.json" -NoReset
          if (Test-Path restart-noreset.json) { "no-reset: $(Get-Content restart-noreset.json)" } else { "no-reset: child never finished -> this is the 'app vanished after update' bug" }
          # Real check: the updater's relaunch must give an independent, working instance
          Relaunch "$PWD\restart.json"
          if (-not (Test-Path restart.json)) { throw "relaunched exe did not survive the parent exiting" }
          Get-Content restart.json
          $r = Get-Content restart.json | ConvertFrom-Json
          if (-not $r.ok -or -not $r.independent) { throw "relaunched exe is not independent" }

      - name: End-to-end self-update (real tray app)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $d = "$env:RUNNER_TEMP\e2e"
          New-Item -ItemType Directory -Force "$d\home" | Out-Null
          Copy-Item dist\redline.exe "$d\redline.exe"      # the installed copy
          Copy-Item dist\redline.exe "$d\new.exe"          # the "downloaded" update
          $h = (Get-FileHash "$d\new.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  redline.exe" | Set-Content -NoNewline -Encoding ascii "$d\new.exe.sha256"
          $next = ${{ github.run_number }} + 1000
          @{ tag_name = "build-$next"; name = "e2e"; html_url = ""; assets = @(
              @{ name = "redline.exe"; browser_download_url = "$d\new.exe" },
              @{ name = "redline.exe.sha256"; browser_download_url = "$d\new.exe.sha256" }) } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$d\feed.json"
          '{"accounts": [], "settings": {"auto_update": false}}' | Set-Content -Encoding utf8 "$d\home\config.json"
          $env:REDLINE_HOME = "$d\home"
          $env:REDLINE_UPDATE_FEED = "$d\feed.json"
          function State { try { Get-Content "$d\home\instance.json" -ErrorAction Stop | ConvertFrom-Json } catch { $null } }
          function Usage($st) {
            try { Invoke-RestMethod -TimeoutSec 5 -Uri "http://127.0.0.1:$($st.port)/api/usage" -Headers @{ "X-Redline-Token" = $st.token } } catch { $null }
          }
          $ok = $false
          try {
            Start-Process "$d\redline.exe" -ArgumentList "--background"
            for ($i = 0; $i -lt 60 -and -not (State); $i++) { Start-Sleep 1 }
            $st = State
            if (-not $st) { throw "tray app never came up" }
            "old instance: pid $($st.pid) port $($st.port)"
            $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($st.port)/api/action" `
                   -Headers @{ "X-Redline-Token" = $st.token } -ContentType "application/json" -Body '{"action":"update"}'
            "update action: $($r.message)"
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep 1
              $n = State
              if ($n -and $n.pid -ne $st.pid) {
                $u = Usage $n
                if ($u -and $u.meta.window_visible) { "new instance: pid $($n.pid), window visible"; $ok = $true; break }
              }
            }
            if (-not (Test-Path "$d\redline.exe.old")) { "note: no .old copy (already cleaned up)" }
          } finally {
            "---- redline.log ----"
            Get-Content "$d\home\redline.log" -ErrorAction SilentlyContinue
            Get-Process redline -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not $ok) { throw "after the update no new instance came up with its window shown" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\redline.exe -Algorithm SHA256).Hash.ToLower()
          "$h  redline.exe" | Set-Content -NoNewline -Encoding ascii dist\redline.exe.sha256
          Get-Content dist\redline.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows
          path: |
            dist/redline.exe
            dist/redline.exe.sha256

      - name: Publish release (auto-update channel)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: redline build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            branch `${{ github.ref_name }}` · commit ${{ github.sha }}
          make_latest: true
          files: |
            dist/redline.exe
            dist/redline.exe.sha256

      - name: Attach to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/redline.exe
            dist/redline.exe.sha256
